name: Build scheef.tech Image

# Manual-only. Dockerfile.branded has never produced a green build and this is a
# ~43-minute linux/arm64 QEMU job; on a push trigger it fired on every
# team-abfindung push (i.e. on every production deploy) and always went red,
# on top of the real TA build in build-ta.yml. It also has no Coolify service
# wired up yet (COOLIFY_ST_SERVICE_UUID unset -> the deploy step self-skips).
# Dispatch it by hand until it goes green and a scheef.tech service exists.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.branded
          platforms: linux/arm64
          push: true
          build-args: |
            BRAND_PROFILE=scheef-tech
          tags: |
            ghcr.io/scheef-tech/documenso-st:latest
            ghcr.io/scheef-tech/documenso-st:${{ github.sha }}

      - name: Deploy to Coolify
        env:
          COOLIFY_ST_SERVICE_UUID: ${{ secrets.COOLIFY_ST_SERVICE_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_ST_SERVICE_UUID" ]; then
            echo "COOLIFY_ST_SERVICE_UUID not set yet — skipping deploy step."
            exit 0
          fi
          curl -s -X POST "https://app.coolify.io/api/v1/services/$COOLIFY_ST_SERVICE_UUID/restart" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN"
