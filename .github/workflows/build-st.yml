name: Build scheef.tech Image

on:
  push:
    branches: [team-abfindung, feat/branding-config]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.branded
          platforms: linux/arm64
          push: true
          build-args: |
            BRAND_PROFILE=scheef-tech
          tags: |
            ghcr.io/scheef-tech/documenso-st:latest
            ghcr.io/scheef-tech/documenso-st:${{ github.sha }}

      - name: Deploy to Coolify
        if: ${{ secrets.COOLIFY_ST_SERVICE_UUID != '' }}
        run: |
          curl -s -X POST "https://app.coolify.io/api/v1/services/${{ secrets.COOLIFY_ST_SERVICE_UUID }}/restart" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
