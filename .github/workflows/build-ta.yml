name: Build Team Abfindung Image

on:
  push:
    branches: [team-abfindung]
    paths:
      - 'Dockerfile.ta'
      - 'patches/**'
      - '.github/workflows/build-ta.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ta
          push: true
          tags: |
            ghcr.io/scheef-tech/documenso-ta:latest
            ghcr.io/scheef-tech/documenso-ta:${{ github.sha }}

      - name: Deploy to Coolify
        run: |
          curl -s -X POST "https://app.coolify.io/api/v1/services/${{ secrets.COOLIFY_SERVICE_UUID }}/restart" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
